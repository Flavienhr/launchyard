name: Setup Godot
description: Installe Godot (Linux headless) à la version épinglée, et optionnellement les export templates. Mis en cache.
inputs:
  version:
    description: Version de Godot (ex. 4.7.2)
    required: true
  templates:
    description: "true pour installer aussi les export templates"
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot-bin
          ~/.local/share/godot/export_templates
        key: godot-${{ inputs.version }}-templates-${{ inputs.templates }}

    - name: Install
      shell: bash
      env:
        V: ${{ inputs.version }}
        TEMPLATES: ${{ inputs.templates }}
      run: |
        set -euo pipefail
        BASE="https://github.com/godotengine/godot/releases/download/${V}-stable"
        mkdir -p ~/godot-bin
        if [ ! -x ~/godot-bin/godot ]; then
          curl -sSfL -o /tmp/godot.zip "$BASE/Godot_v${V}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${V}-stable_linux.x86_64" ~/godot-bin/godot
        fi
        echo "$HOME/godot-bin" >> "$GITHUB_PATH"
        TDIR="$HOME/.local/share/godot/export_templates/${V}.stable"
        if [ "$TEMPLATES" = "true" ] && [ ! -d "$TDIR" ]; then
          curl -sSfL -o /tmp/templates.tpz "$BASE/Godot_v${V}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mkdir -p "$TDIR"
          mv /tmp/tpl/templates/* "$TDIR/"
        fi
