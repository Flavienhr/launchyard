name: CI

# push limité à main : sur une branche de PR, l'événement pull_request suffit
# (sinon chaque commit déclenche deux runs identiques).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"  # épinglée, voir docs/adr/0001-moteur-godot.md

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: make setup
      - run: make validate
      - run: make assets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
      - run: make test

  export:
    needs: [validate, test]
    uses: ./.github/workflows/export.yml
