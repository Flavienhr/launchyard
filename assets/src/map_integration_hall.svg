    <rect x="4" y="4" width="120" height="184" rx="2"/>
    <line x1="64" y1="4" x2="64" y2="188" stroke-width="1"/>
    <line x1="4" y1="40" x2="124" y2="40" stroke-width="1" stroke="#1E3A52"/>
    <line x1="4" y1="76" x2="124" y2="76" stroke-width="1" stroke="#1E3A52"/>
    <line x1="4" y1="112" x2="124" y2="112" stroke-width="1" stroke="#1E3A52"/>
    <line x1="4" y1="148" x2="124" y2="148" stroke-width="1" stroke="#1E3A52"/>
  </g>
  <g id="accent" fill="none" stroke="#FFB547" stroke-width="2" stroke-linejoin="round">
    <rect x="108" y="40" width="16" height="112"/>
