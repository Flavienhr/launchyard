<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96">
  <!-- Entrepôt 4x3 : toit à deux pans, quais de chargement au sud (accent logistique). -->
  <g id="body" fill="#101A26" stroke="#7A8FA3" stroke-width="2" stroke-linejoin="round">
    <rect x="4" y="4" width="120" height="76" rx="2"/>
    <line x1="4" y1="42" x2="124" y2="42" stroke-width="1"/>
    <line x1="34" y1="4" x2="34" y2="80" stroke-width="1" stroke="#1E3A52"/>
    <line x1="64" y1="4" x2="64" y2="80" stroke-width="1" stroke="#1E3A52"/>
    <line x1="94" y1="4" x2="94" y2="80" stroke-width="1" stroke="#1E3A52"/>
  </g>
  <g id="accent" fill="none" stroke="#4FD1FF" stroke-width="2" stroke-linejoin="round">
    <rect x="14" y="80" width="24" height="12"/>
    <rect x="52" y="80" width="24" height="12"/>
    <rect x="90" y="80" width="24" height="12"/>
  </g>
</svg>
