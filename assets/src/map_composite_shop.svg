    <rect x="4" y="4" width="88" height="88" rx="2"/>
    <line x1="4" y1="16" x2="92" y2="16" stroke-width="1" stroke="#1E3A52"/>
    <line x1="4" y1="80" x2="92" y2="80" stroke-width="1" stroke="#1E3A52"/>
  </g>
  <g id="accent" fill="#101A26" stroke="#5BE49B" stroke-width="2" stroke-linejoin="round">
