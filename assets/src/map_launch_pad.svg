<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Pas de tir 4x4 : dalle, carneau, tour ombilicale à l'ouest (accent lancement). -->
  <g id="body" fill="#101A26" stroke="#7A8FA3" stroke-width="2" stroke-linejoin="round">
    <rect x="4" y="4" width="120" height="120" rx="2"/>
    <rect x="52" y="16" width="64" height="96" stroke-width="1" stroke="#1E3A52"/>
    <rect x="60" y="52" width="48" height="24" fill="#0B1119" stroke="#1E3A52"/>
  </g>
  <g id="accent" fill="none" stroke="#FFB547" stroke-width="2" stroke-linejoin="round">
    <rect x="12" y="40" width="24" height="48"/>
    <line x1="12" y1="52" x2="36" y2="76" stroke-width="1"/>
    <line x1="36" y1="52" x2="12" y2="76" stroke-width="1"/>
    <line x1="36" y1="64" x2="68" y2="64"/>
    <circle cx="84" cy="64" r="10"/>
  </g>
</svg>
